[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wpycli"
version = "0.3.0"
description = "Cobra-inspired CLI toolkit for Python"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "wkqco33" }]
keywords = ["cli", "command-line", "cobra", "toolkit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = ["wpyconf", "wpylog"]

[project.urls]
Homepage = "https://github.com/wkqco33/wpycli"
Repository = "https://github.com/wkqco33/wpycli"
Issues = "https://github.com/wkqco33/wpycli/issues"

[project.scripts]
wpycli = "wpycli.cli.main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["wpycli*"]

[tool.setuptools.package-data]
wpycli = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["README.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM", "PLW", "PYI"]

[tool.ruff.format]
quote-style = "double"

[tool.basedpyright]
include = ["wpycli", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportImportCycles = false

[tool.coverage.run]
branch = true
source = ["wpycli"]

[tool.coverage.report]
fail_under = 88
skip_covered = true

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "build>=1.5.0",
    "coverage>=7.15.4",
    "ruff>=0.16.3",
    "twine>=7.0.0",
]
