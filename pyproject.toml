[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wpycli"
version = "0.1.0"
description = "Cobra-inspired CLI toolkit for Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "wlogger @ https://pypi.wkqcosoft.cloud/packages/wlogger-0.2.7-py3-none-any.whl",
    "wconfig @ https://pypi.wkqcosoft.cloud/packages/wconfig-0.1.0-py3-none-any.whl",
]

[project.scripts]
wpycli = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["wpycli*"]
