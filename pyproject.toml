[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wpycli"
version = "0.1.5"
description = "Cobra-inspired CLI toolkit for Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["wconfig", "wlogger"]

[project.scripts]
wpycli = "wpycli.cli.main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["wpycli*"]

[[tool.uv.index]]
name = "rcf"
url = "https://pypi.wkqcosoft.cloud"
