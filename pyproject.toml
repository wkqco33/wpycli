[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wpycli"
version = "0.2.0"
description = "Cobra-inspired CLI toolkit for Python"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "wkqco33" }]
keywords = ["cli", "command-line", "cobra", "toolkit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = ["wpyconf", "wpylog"]

[project.urls]
Homepage = "https://github.com/wkqco33/wpycli"
Repository = "https://github.com/wkqco33/wpycli"
Issues = "https://github.com/wkqco33/wpycli/issues"

[project.scripts]
wpycli = "wpycli.cli.main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["wpycli*"]
